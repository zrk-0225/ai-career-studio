<!-- 应用主体：左侧固定导航 + 右侧内容区 -->
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

      </button>
      <div class="topbar__text">
        <h2 id="topbar-title">概览</h2>
        <p id="topbar-desc">你的职业规划全景</p>
      </div>
      <div class="topbar__actions">
        <button class="btn btn--ghost" data-action="go-guide" title="使用指引">
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-help"></use></svg>
          <span class="hide-sm">指引</span>
        </button>
        <button class="btn btn--ghost" data-action="open-settings">
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-settings"></use></svg>
          <span class="hide-sm">设置</span>
        </button>
      </div>
    </header>

    <div class="view" id="view">
      <div class="boot-loading">正在加载工作台…</div>
    </div>
  </main>
</div>
